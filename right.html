<!DOCTYPE html>
<html>
<head>
<title>Home</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#eef2f7;
    padding:30px;
}

h2{
    text-align:center;
    color:#0d47a1;
    margin-bottom:15px;
}

p{
    text-align:center;
    font-size:17px;
    color:#444;
    line-height:28px;
}

.container{
    margin-top:40px;
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

.card{
    width:220px;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 12px 20px rgba(0,0,0,0.3);
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
}

.card a{
    display:block;
    padding:15px;
    text-decoration:none;
    color:#0d47a1;
    font-size:20px;
    font-weight:bold;
}

.card a:hover{
    background:#0d47a1;
    color:white;
}

</style>

</head>

<body>

<h2>Welcome to Online Book Store</h2>

<p>
This website provides engineering books for students of different departments such as
<b>CSBS</b>, <b>CSE</b>, <b>ECE</b>, and <b>EEE</b>.
</p>

<p>
Students can register, log in, browse available books, view the catalogue,
and add books to their shopping cart.
</p>

<div class="container">

<div class="card">
<img src="csbs.jpg" alt="CSBS">
<a href="csbs.html" target="right">CSBS</a>
</div>

<div class="card">
<img src="cse.jpg" alt="CSE">
<a href="cse.html" target="right">CSE</a>
</div>

<div class="card">
<img src="ece.jpg" alt="ECE">
<a href="ece.html" target="right">ECE</a>
</div>

<div class="card">
<img src="eee.jpg" alt="EEE">
<a href="eee.html" target="right">EEE</a>
</div>

</div>

</body>
</html>
