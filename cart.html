<!DOCTYPE html>
<html>
<head>

<title>Cart</title>

<style>

body{

font-family:Arial;

background:#fafafa;

}

h2{

text-align:center;

color:#0F172A;

}

table{

margin:auto;

width:60%;

border-collapse:collapse;

}

th{

background:#0F172A;

color:white;

padding:10px;

}

td{

border:1px solid gray;

padding:10px;

text-align:center;

}

</style>

</head>

<body>

<h2>Shopping Cart</h2>

<table>

<tr>

<th>Book</th>

<th>Price</th>

</tr>

<tr>

<td>Data Structures</td>

<td>₹550</td>

</tr>

<tr>

<td>DBMS</td>

<td>₹650</td>

</tr>

<tr>

<th>Total</th>

<th>₹1200</th>

</tr>

</table>

</body>

</html>
