<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
}

h2{
    text-align:center;
    color:#0F172A;
}

table{
    margin:auto;
    margin-top:40px;
    border:1px solid gray;
    padding:20px;
    background:white;
}

td{
    padding:10px;
}

input{
    padding:5px;
}

input[type="submit"],input[type="reset"]{
    background:#0F172A;
    color:white;
    border:none;
    padding:8px 15px;
    cursor:pointer;
}

</style>

</head>

<body>

<h2>Login Page</h2>

<form>

<table>

<tr>
<td>Username</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Password</td>
<td><input type="password"></td>
</tr>

<tr>
<td colspan="2" align="center">

<input type="submit" value="Login">

<input type="reset" value="Clear">

</td>
</tr>

</table>

</form>

</body>
</html>
