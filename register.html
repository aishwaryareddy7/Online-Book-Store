<!DOCTYPE html>
<html>
<head>
<title>Registration</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
}

h2{
text-align:center;
color:#0F172A;
}

table{
margin:auto;
background:white;
padding:20px;
border:1px solid gray;
}

td{
padding:8px;
}

input{
padding:5px;
}

input[type="submit"],input[type="reset"]{
background:#0F172A;
color:white;
border:none;
padding:8px 15px;
cursor:pointer;
}

</style>

</head>

<body>

<h2>Registration Form</h2>

<form>

<table>

<tr>
<td>Name</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Email</td>
<td><input type="email"></td>
</tr>

<tr>
<td>Phone</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Username</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Password</td>
<td><input type="password"></td>
</tr>

<tr>
<td>Confirm Password</td>
<td><input type="password"></td>
</tr>

<tr>

<td colspan="2" align="center">

<input type="submit" value="Register">

<input type="reset" value="Clear">

</td>

</tr>

</table>

</form>

</body>

</html>
